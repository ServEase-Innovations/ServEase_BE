name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Select Branch & Profile
        id: select
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "profile=dev" >> $GITHUB_OUTPUT

          elif [ "${{ github.event.inputs.environment }}" = "qa" ]; then
            echo "branch=qa" >> $GITHUB_OUTPUT
            echo "profile=qa" >> $GITHUB_OUTPUT

          elif [ "${{ github.event.inputs.environment }}" = "uat" ]; then
            echo "branch=uat" >> $GITHUB_OUTPUT
            echo "profile=uat" >> $GITHUB_OUTPUT

          elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "branch=master" >> $GITHUB_OUTPUT
            echo "profile=prod" >> $GITHUB_OUTPUT
          fi

      - name: Debug Inputs
        run: |
          echo "Selected ENV: ${{ github.event.inputs.environment }}"
          echo "Branch: ${{ steps.select.outputs.branch }}"
          echo "Profile: ${{ steps.select.outputs.profile }}"

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.select.outputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR
        run: mvn clean package -Dspring.profiles.active=${{ steps.select.outputs.profile }} -DskipTests

      - name: Prepare deploy JAR
        run: |
          mkdir -p deploy
          cp target/*.jar deploy/app.jar
          ls -ltr deploy

      - name: Copy JAR to EC2 using manual SCP
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

          scp -o StrictHostKeyChecking=no \
            -i key.pem \
            deploy/app.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/app.jar

      - name: Restart Service
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Stopping service..."
            sudo systemctl stop servease || true
            echo "Starting service..."
            sudo systemctl start servease
            echo "Status:"
            sudo systemctl status servease --no-pager

      - name: Debug Active Spring Profile
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo ">>> systemd profile:"
            grep SPRING_PROFILES_ACTIVE /etc/systemd/system/servease.service || true

            echo ">>> /etc/environment:"
            grep SPRING_PROFILES_ACTIVE /etc/environment || true

            echo ">>> Logs showing profile:"
            sudo journalctl -u servease -n 50 | grep profile || true
