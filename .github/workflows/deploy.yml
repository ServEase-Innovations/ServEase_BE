name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Deployment Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Determine Branch for Environment
        id: branch_map
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "profile=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.environment }}" = "qa" ]; then
            echo "branch=qa" >> $GITHUB_OUTPUT
            echo "profile=qa" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.environment }}" = "uat" ]; then
            echo "branch=uat" >> $GITHUB_OUTPUT
            echo "profile=uat" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "branch=master" >> $GITHUB_OUTPUT
            echo "profile=prod" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Selected Branch
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.branch_map.outputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR with Spring Profile
        run: |
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "Branch: ${{ steps.branch_map.outputs.branch }}"
          echo "Spring Profile: ${{ steps.branch_map.outputs.profile }}"
          mvn clean package -DskipTests -Dspring.profiles.active=${{ steps.branch_map.outputs.profile }}

      - name: Rename JAR to app.jar
        run: |
          mkdir -p deploy
          cp target/*.jar deploy/app.jar
          ls -ltr deploy

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "deploy/app.jar"
          target: "/home/ubuntu/app/app.jar"
          overwrite: true
          debug: true

      - name: Restart Service
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Stopping service..."
            sudo systemctl stop servease || true

            echo "Starting service..."
            sudo systemctl start servease

            echo "Checking status..."
            sudo systemctl status servease --no-pager
