name: Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Select Branch & Profile
        id: select
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "profile=dev" >> $GITHUB_OUTPUT

          elif [ "${{ github.event.inputs.environment }}" = "qa" ]; then
            echo "branch=qa" >> $GITHUB_OUTPUT
            echo "profile=qa" >> $GITHUB_OUTPUT

          elif [ "${{ github.event.inputs.environment }}" = "uat" ]; then
            echo "branch=uat" >> $GITHUB_OUTPUT
            echo "profile=uat" >> $GITHUB_OUTPUT

          elif [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            echo "branch=master" >> $GITHUB_OUTPUT
            echo "profile=prod" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.select.outputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Prepare deploy JAR
        run: |
          mkdir -p deploy
          cp target/*.jar deploy/app.jar
          ls -ltr deploy

      - name: Copy JAR to EC2 (NO TAR)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "deploy/*"
          target: "/home/ubuntu/app/"
          overwrite: true
          strip_components: 0
          rm: false
          debug: true

      - name: Update Systemd Profile on EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Setting profile to: ${{ steps.select.outputs.profile }}"
            sudo sed -i 's/^Environment=.*/Environment="SPRING_PROFILES_ACTIVE=${{ steps.select.outputs.profile }}"/' /etc/systemd/system/servease.service
            sudo systemctl daemon-reload

      - name: Restart Service
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Stopping service..."
            sudo systemctl stop servease || true
            echo "Starting service..."
            sudo systemctl start servease
            echo "Status:"
            sudo sys
